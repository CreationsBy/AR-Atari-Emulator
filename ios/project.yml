name: AtariDiorama
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Bridge.h"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../native/include"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../build/native-ios"
    OTHER_LDFLAGS: ["$(inherited)", "-lAtariDiorama", "-lc++"]
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AtariDiorama:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: [Resources, project.yml, Info.plist, "*.xcodeproj"]
      - path: Resources
        buildPhase: resources
      - path: ../profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AtariDiorama
        INFOPLIST_FILE: Info.plist
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
    scheme:
      gatherCoverageData: false
      archive:
        config: Release
